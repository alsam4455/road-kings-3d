
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ROAD KINGS 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8eb7ce;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}

#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:white;text-shadow:0 2px 5px #000}
.pill{background:linear-gradient(135deg,#071521e8,#142d3be8);border:1px solid #ffffff40;border-radius:12px;padding:9px 13px;min-width:82px;box-shadow:0 5px 18px #0004}
.small{font-size:10px;letter-spacing:1.4px;color:#a9c4d4}
.value{font-size:19px;font-weight:900;margin-top:3px}

#bottom{position:fixed;bottom:16px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.cluster{display:flex;gap:12px;pointer-events:auto}
.ctrl{width:66px;height:66px;border-radius:18px;background:#071521b8;border:1px solid #ffffff90;color:white;font-size:27px;font-weight:bold;display:grid;place-items:center;user-select:none;touch-action:none;box-shadow:0 5px 18px #0005}
.ctrl:active{background:#167aa9}
.ctrl.gas{height:78px;width:78px;background:#b87918e8;border-radius:22px;font-size:30px}

#menu{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(120deg,#071521b8,#07152165);color:white}
.panel{width:min(92vw,450px);padding:28px 24px;border-radius:20px;background:linear-gradient(145deg,#071521f2,#173449ed);border:1px solid #ffffff55;text-align:center;box-shadow:0 20px 70px #0008}
h1{font-size:clamp(28px,7vw,46px);letter-spacing:2px;margin:0 0 8px}
.sub{color:#c7d8e4;line-height:1.55;margin:8px 0 22px}
button{border:0;border-radius:12px;padding:15px 32px;background:linear-gradient(90deg,#e5a32b,#ffd36a);font-size:17px;font-weight:900;letter-spacing:1px;color:#14202a;cursor:pointer}
#status{font-size:12px;color:#a9c4d4;margin-top:14px}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#071521dd;color:white;padding:9px 14px;border-radius:10px;font-size:12px;display:none}

@media(max-width:600px){
.pill{padding:7px 9px;min-width:65px}
.value{font-size:16px}
.small{font-size:9px}
.ctrl{width:58px;height:58px}
.ctrl.gas{width:68px;height:68px}
#bottom{bottom:12px}
}
</style>

<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>

<body>

<div id="hud">
<div class="pill"><div class="small">RACE LEVEL</div><div class="value" id="level">01</div></div>
<div class="pill"><div class="small">DISTANCE</div><div class="value" id="distance">0 m</div></div>
<div class="pill"><div class="small">SPEED</div><div class="value" id="speed">0 <small>km/h</small></div></div>
</div>

<div id="bottom">
<div class="cluster">
<div class="ctrl" id="left">◀</div>
<div class="ctrl" id="right">▶</div>
</div>
<div class="ctrl gas" id="gas">▲</div>
</div>

<div id="toast"></div>

<div id="menu">
<div class="panel">
<h1 id="title">ROAD KINGS 3D</h1>
<div class="sub" id="desc">
REAL 3D SPORTS CAR · NATURAL HIGHWAY · CHASE CAMERA
<br>Drive through a living 3D racing environment.
</div>
<button id="start">START RACE</button>
<div id="status">Loading 3D vehicle…</div>
</div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9cc6df);
scene.fog=new THREE.Fog(0x9cc6df,95,390);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,700);
camera.position.set(0,5.5,12);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:'high-performance'
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9edff,0x50613d,2.0));

const sun=new THREE.DirectionalLight(0xffedcf,3.0);
sun.position.set(-45,75,25);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-65;
sun.shadow.camera.right=65;
sun.shadow.camera.top=80;
sun.shadow.camera.bottom=-80;
scene.add(sun);

const mat=(color,rough=.8)=>
new THREE.MeshStandardMaterial({color,roughness:rough});

// Asphalt road texture
function asphaltTexture(){
const c=document.createElement('canvas');
c.width=512;
c.height=512;
const x=c.getContext('2d');

x.fillStyle='#34383b';
x.fillRect(0,0,512,512);

for(let i=0;i<18000;i++){
const v=35+Math.random()*48;
x.fillStyle=`rgba(${v},${v},${v},${Math.random()*.24})`;
x.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*2,1+Math.random()*2);
}

const t=new THREE.CanvasTexture(c);
t.wrapS=t.wrapT=THREE.RepeatWrapping;
t.repeat.set(2,38);
t.colorSpace=THREE.SRGBColorSpace;
return t;
}

const roadMat=new THREE.MeshStandardMaterial({
map:asphaltTexture(),
roughness:.96
});

const road=new THREE.Mesh(
new THREE.PlaneGeometry(18,650),
roadMat
);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.04,-265);
road.receiveShadow=true;
scene.add(road);

// Natural ground
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(900,900),
mat(0x547b42)
);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.18,-260);
ground.receiveShadow=true;
scene.add(ground);

// Road edges
for(const x of [-9.15,9.15]){
const edge=new THREE.Mesh(
new THREE.BoxGeometry(.22,.035,650),
mat(0xe9e6d6)
);
edge.position.set(x,.015,-265);
scene.add(edge);
}

// Lane markings
for(const x of [-3,3]){
for(let z=20;z>-590;z-=16){
const dash=new THREE.Mesh(
new THREE.BoxGeometry(.13,.025,7),
mat(0xf3f1e7)
);
dash.position.set(x,.018,z);
scene.add(dash);
}
}

// Safety barriers
for(const x of [-10.3,10.3]){
const rail=new THREE.Mesh(
new THREE.BoxGeometry(.16,.55,650),
mat(0x9da7aa,.55)
);
rail.position.set(x,.58,-265);
scene.add(rail);

for(let z=20;z>-600;z-=8){
const post=new THREE.Mesh(
new THREE.BoxGeometry(.13,.8,.15),
mat(0x747d80)
);
post.position.set(x,.3,z);
scene.add(post);
}
}

// Distant hills
for(let i=0;i<18;i++){
const m=new THREE.Mesh(
new THREE.SphereGeometry(1,18,12),
mat([0x718c64,0x81966d,0x667f5b][i%3])
);

m.scale.set(
24+Math.random()*30,
7+Math.random()*12,
12+Math.random()*15
);

m.position.set(
(i%2?1:-1)*(35+Math.random()*90),
-1,
-90-i*24
);
scene.add(m);
}

// Trees
const treeGroups=[];

function makeTree(x,z,s=1){
const g=new THREE.Group();

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.18*s,.32*s,3.2*s,8),
mat(0x62442c)
);
trunk.position.y=1.6*s;
trunk.castShadow=true;
g.add(trunk);

for(let k=0;k<4;k++){
const crown=new THREE.Mesh(
new THREE.IcosahedronGeometry((1.55-k*.18)*s,2),
mat([0x315f35,0x3d713b,0x4c8042][k%3])
);

crown.position.set(
(Math.random()-.5)*.25*s,
(3.2+k*.72)*s,
(Math.random()-.5)*.2*s
);

crown.scale.set(1,1.15,.9);
crown.castShadow=true;
g.add(crown);
}

g.position.set(x,0,z);
scene.add(g);
treeGroups.push(g);
}

for(let z=35;z>-610;z-=13){
makeTree(-15-Math.random()*7,z,1.1+Math.random()*.8);
makeTree(15+Math.random()*7,z-5,1.1+Math.random()*.8);
}

// Grass details
const grassMat=mat(0x668c43);

for(let i=0;i<160;i++){
const x=(Math.random()<.5?-1:1)*(11+Math.random()*18);
const z=25-Math.random()*600;

const b=new THREE.Mesh(
new THREE.ConeGeometry(.12+Math.random()*.18,.6+Math.random()*.8,5),
grassMat
);

b.position.set(x,.25,z);
scene.add(b);
}

// Grandstands and spectators
for(const side of [-1,1]){
const stand=new THREE.Group();

const base=new THREE.Mesh(
new THREE.BoxGeometry(10,2,44),
mat(0x777f83)
);

base.position.set(side*21,1,-175);
stand.add(base);

for(let r=0;r<4;r++){
const bench=new THREE.Mesh(
new THREE.BoxGeometry(10,.22,44),
mat(0x9b9fa1)
);

bench.position.set(side*21,2.2+r*.72,-175);
stand.add(bench);

for(let j=0;j<24;j++){
const person=new THREE.Group();

const shirt=mat(
[0xb33b31,0x244e7a,0xe2b544,0xe4e4db,0x35634a][(j+r)%5]
);

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.16,.42,3,6),
shirt
);

body.position.y=.38;

const head=new THREE.Mesh(
new THREE.SphereGeometry(.14,8,6),
mat(0xc99572)
);

head.position.y=.72;
person.add(body,head);

person.position.set(
side*21-4.3+j*.37,
2.35+r*.72,
-196+Math.random()*42
);

stand.add(person);
}
}

scene.add(stand);
}

// 3D sports car model
let player=null;
let carTemplate=null;
let carReady=false;

const loader=new GLTFLoader();

const carURL=
'https://jaronkbragg7337.github.io/spectral-gt-rs/spectral_gt_rs_game_ready.glb';

function fitCar(model){
const box=new THREE.Box3().setFromObject(model);
const size=box.getSize(new THREE.Vector3());
const center=box.getCenter(new THREE.Vector3());

const scale=4.5/Math.max(size.x,size.z);

model.position.copy(center).multiplyScalar(-scale);
model.scale.setScalar(scale);

model.traverse(o=>{
if(o.isMesh){
o.castShadow=true;
o.receiveShadow=true;
}
});

const wrapper=new THREE.Group();
wrapper.rotation.y=Math.PI/2;
wrapper.add(model);

return wrapper;
}

loader.load(
carURL,
g=>{
carTemplate=fitCar(g.scene);
player=carTemplate.clone(true);
player.position.set(0,.62,2);
scene.add(player);
carReady=true;
$('status').textContent='3D sports car loaded · Ready';
},
p=>{
$('status').textContent=p.total?
'Loading 3D vehicle '+Math.round(p.loaded/p.total*100)+'%':
'Loading 3D vehicle…';
},
e=>{
$('status').textContent='Vehicle model could not load. Check internet, then refresh.';
console.error(e);
}
);

// Rival cars
const rivals=[];

function addRival(z,lane){
if(!carTemplate)return;

const c=carTemplate.clone(true);
c.position.set(lane*4,.62,z);
c.scale.multiplyScalar(.96);
scene.add(c);

rivals.push({mesh:c,z,lane});
}

let running=false;
let gas=false;
let steer=0;
let speed=0;
let distance=0;
let level=1;
let playerX=0;
let spawn=0;
let last=0;
let toastTimer=0;

function toast(t){
$('toast').textContent=t;
$('toast').style.display='block';
toastTimer=2;
}

function start(){
if(!carReady){
toast('3D car is still loading. Please wait.');
return;
}

running=true;
speed=65;
distance=0;
playerX=0;
spawn=0;

for(const r of rivals){
scene.remove(r.mesh);
}

rivals.length=0;
$('menu').style.display='none';
}

$('start').onclick=()=>{
if(level>1){
$('title').textContent='ROAD KINGS 3D';
$('desc').innerHTML='REAL 3D SPORTS CAR · NATURAL HIGHWAY · CHASE CAMERA';
$('start').textContent='START RACE';
}
start();
};

// Controls
function hold(id,fn){
const el=$(id);

el.addEventListener('pointerdown',e=>{
e.preventDefault();
el.setPointerCapture(e.pointerId);
fn(true);
});

['pointerup','pointercancel','lostpointercapture'].forEach(n=>{
el.addEventListener(n,()=>fn(false));
});
}

hold('left',v=>steer=v?-1:0);
hold('right',v=>steer=v?1:0);
hold('gas',v=>gas=v);

// Keyboard controls
addEventListener('keydown',e=>{
if(['ArrowLeft','a','A'].includes(e.key))steer=-1;
if(['ArrowRight','d','D'].includes(e.key))steer=1;
if(['ArrowUp','w','W',' '].includes(e.key))gas=true;
});

addEventListener('keyup',e=>{
if(['ArrowLeft','a','A','ArrowRight','d','D'].includes(e.key))steer=0;
if(['ArrowUp','w','W',' '].includes(e.key))gas=false;
});

// Game update
function update(dt){
if(!running)return;

const target=gas?220:115;
speed=THREE.MathUtils.damp(speed,target,1.15,dt);

playerX=THREE.MathUtils.clamp(
playerX+steer*dt*(speed/85),
-1.55,
1.55
);

distance+=speed*dt*.28;
spawn+=dt;

if(spawn>2.8){
spawn=0;
addRival(
-170-Math.random()*100,
[-1,0,1][Math.floor(Math.random()*3)]
);
}

// Move rival cars
for(let i=rivals.length-1;i>=0;i--){
const r=rivals[i];
r.z+=speed*dt*.48;
r.mesh.position.z=r.z;

if(r.z>15){
scene.remove(r.mesh);
rivals.splice(i,1);
}
}

// Player car movement
if(player){
player.position.x=playerX*3.2;
player.position.y=.62+Math.sin(performance.now()*.008)*.012;

player.rotation.z=THREE.MathUtils.damp(
player.rotation.z,
-steer*.07,
5,
dt
);
}

// HUD
$('speed').innerHTML=Math.round(speed)+' <small>km/h</small>';
$('distance').textContent=Math.floor(distance)+' m';

// Level progression
if(distance>level*1100){
running=false;
level++;

$('level').textContent=String(level).padStart(2,'0');
$('title').textContent='LEVEL COMPLETE';
$('desc').innerHTML='Excellent driving!<br>New road stage unlocked.';
$('start').textContent='NEXT LEVEL';
$('menu').style.display='grid';
}
}

// Camera and animation
function animate(t){
requestAnimationFrame(animate);

const dt=Math.min((t-last)/1000||0,.04);
last=t;

update(dt);

const targetX=playerX*3.2;

camera.position.x=THREE.MathUtils.damp(
camera.position.x,
targetX*.72,
3.4,
dt
);

camera.position.y=THREE.MathUtils.damp(
camera.position.y,
5.0,
2,
dt
);

camera.position.z=THREE.MathUtils.damp(
camera.position.z,
12.5,
2,
dt
);

camera.lookAt(targetX*.55,1.05,-13);

if(toastTimer>0){
toastTimer-=dt;

if(toastTimer<=0){
$('toast').style.display='none';
}
}

renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// Resize
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
});

</script>
</body>
</html>
