
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROAD KINGS 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.stat{background:#101820dd;color:white;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:bold}
#menu{position:fixed;inset:0;background:#07111bcc;display:grid;place-items:center;color:white}
.panel{width:min(90%,430px);padding:25px;background:#101e2eee;border:1px solid #ffffff55;border-radius:18px;text-align:center}
h1{font-size:clamp(30px,8vw,48px);margin:0 0 12px;letter-spacing:2px}
p{color:#d8e3ed;line-height:1.5}
button{border:0;border-radius:12px;padding:14px 28px;background:#f5b51b;color:#171717;font-weight:900;font-size:18px;cursor:pointer}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.group{display:flex;gap:12px}
.control{width:66px;height:66px;border-radius:50%;border:2px solid white;background:#101820bb;color:white;font-size:27px;font-weight:bold;display:grid;place-items:center;pointer-events:auto;user-select:none}
#gas{width:76px;height:76px;background:#a86c12dd}
#help{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);color:white;font-size:11px;text-shadow:0 2px 3px black;white-space:nowrap}
@media(orientation:portrait){#help{bottom:102px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="stat" id="level">LEVEL 1</div>
 <div class="stat" id="distance">0 m</div>
 <div class="stat" id="speed">0 km/h</div>
</div>

<div id="menu">
 <div class="panel">
  <h1 id="heading">ROAD KINGS 3D</h1>
  <p id="message">Sports car racing<br>Long race road · Rival cars · Spectator stands</p>
  <p id="submessage">Ready to race?</p>
  <button id="start">START RACE</button>
 </div>
</div>

<div id="controls">
 <div class="group">
  <div class="control" id="left">◀</div>
  <div class="control" id="right">▶</div>
 </div>
 <div class="control" id="gas">▲</div>
</div>
<div id="help">PC: Arrow keys / WASD &nbsp; | &nbsp; Mobile: Touch controls</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;

function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2);
 W=innerWidth; H=innerHeight;
 canvas.width=W*DPR; canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

let playing=false;
let level=1;
let distance=0;
let speed=0;
let playerX=0;
let steering=0;
let gas=false;
let last=0;
let roadOffset=0;
let rivals=[];
let spawn=0;
let finish=1200;
let messageTimer=0;

const $=id=>document.getElementById(id);

function polygon(points,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
 ctx.closePath();
 ctx.fill();
}

function roadWidth(t){return W*(.08+.48*t)}
function roadCenter(t){return W/2+Math.sin(distance*.00018+t*.8)*W*.018}

function drawBackground(){
 const sky=ctx.createLinearGradient(0,0,0,H*.65);
 sky.addColorStop(0,"#76b9df");
 sky.addColorStop(1,"#d6e7e7");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#657d52";ctx.fillRect(0,H*.46,W,H*.54);
 polygon([[0,H*.49],[W*.5,H*.43],[W,H*.49],[W,H*.57],[0,H*.57]],"#82976a");
}

function drawRoad(){
 const top=H*.31,bottom=H*.96;
 const segments=45;
 for(let i=0;i<segments;i++){
  const t1=i/segments,t2=(i+1)/segments;
  const y1=top+(bottom-top)*t1*t1;
  const y2=top+(bottom-top)*t2*t2;
  const w1=roadWidth(t1),w2=roadWidth(t2);
  const c1=roadCenter(t1),c2=roadCenter(t2);
  const stripe=(Math.floor((i+roadOffset)%12)<6);
  polygon([[c1-w1,y1],[c1+w1,y1],[c2+w2,y2],[c2-w2,y2]],stripe?"#34383d":"#303438");
  polygon([[c1-w1,y1],[c1-w1+Math.max(2,w1*.035),y1],[c2-w2+Math.max(2,w2*.035),y2],[c2-w2,y2]],"#eee9dc");
  polygon([[c1+w1-Math.max(2,w1*.035),y1],[c1+w1,y1],[c2+w2,y2],[c2+w2-Math.max(2,w2*.035),y2]],"#eee9dc");
  if(Math.floor((i+roadOffset)%8)<4){
   for(const lane of [-1/3,1/3]){
    const x1=c1+w1*lane,x2=c2+w2*lane;
    polygon([[x1-1,y1],[x1+1,y1],[x2+Math.max(1,w2*.006),y2],[x2-Math.max(1,w2*.006),y2]],"#e7e7df");
   }
  }
 }
}

function drawStands(){
 const top=H*.35,bottom=H*.93;
 for(const side of [-1,1]){
  for(let row=0;row<4;row++){
   for(let i=0;i<28;i++){
    const t=(i/28+((roadOffset*.012)%1))%1;
    const y=top+(bottom-top)*t*t;
    const rw=roadWidth(t);
    const cx=roadCenter(t);
    const x=cx+side*(rw+W*(.035+row*.035));
    const scale=.12+t*.9;
    const seatW=5*scale,seatH=3*scale;
    ctx.fillStyle=["#555d66","#777e85","#414951"][row%3];
    ctx.fillRect(x-seatW,y-seatH,seatW*2,seatH*2);
    ctx.fillStyle=["#b52d31","#234d80","#d0a02b","#888b91"][(i+row)%4];
    ctx.fillRect(x-2.4*scale,y-9*scale,4.8*scale,7*scale);
    ctx.fillStyle=["#d4a17d","#9b694c","#edc29c"][(i+row)%3];
    ctx.beginPath();ctx.arc(x,y-11*scale,2.7*scale,0,Math.PI*2);ctx.fill();
   }
  }
  ctx.fillStyle="#737a80";
  ctx.fillRect(side===-1?0:W*.0,H*.91,W*.0,1);
 }
}

function drawCar(x,y,scale,color){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale,scale);
 // shadow
 ctx.fillStyle="#0008";
 ctx.beginPath();ctx.ellipse(0,3,30,12,0,0,Math.PI*2);ctx.fill();
 // tyres
 ctx.fillStyle="#101114";
 ctx.fillRect(-27,-18,9,22);ctx.fillRect(18,-18,9,22);
 ctx.fillRect(-27,17,9,22);ctx.fillRect(18,17,9,22);
 // body
 polygon([[-23,-29],[23,-29],[29,-13],[27,25],[19,34],[-19,34],[-27,25],[-29,-13]],color);
 // bonnet
 polygon([[-22,-26],[22,-26],[20,-7],[-20,-7]],color);
 // glass
 polygon([[-17,-5],[17,-5],[13,13],[-13,13]],"#172c3b");
 // roof reflection
 polygon([[-14,-4],[14,-4],[10,3],[-10,3]],"#496879");
 // headlights
 ctx.fillStyle="#fff2c9";
 ctx.fillRect(-20,-27,9,4);ctx.fillRect(11,-27,9,4);
 ctx.fillStyle="#ef2828";
 ctx.fillRect(-20,28,8,4);ctx.fillRect(12,28,8,4);
 ctx.fillStyle="#c4cbd0";
 ctx.fillRect(-4,31,8,2);
 ctx.restore();
}

function projectRival(r){
 const t=Math.max(0,Math.min(1,1-r.z/850));
 const y=H*.34+(H*.60)*t*t;
 const rw=roadWidth(t);
 const cx=roadCenter(t);
 const x=cx+r.lane*rw*.7;
 const scale=.18+t*.95;
 return {x,y,scale};
}

function drawRivals(){
 for(const r of rivals){
  const p=projectRival(r);
  drawCar(p.x,p.y,p.scale,r.color);
 }
}

function drawPlayer(){
 const y=H*.79;
 const x=W/2+playerX*W*.22;
 drawCar(x,y,Math.min(W/360,1.25),"#d51e2b");
}

function drawScene(){
 drawBackground();
 drawRoad();
 drawStands();
 drawRivals();
 drawPlayer();
}

function update(dt){
 if(!playing)return;
 const target=gas?190:105;
 speed+=((target-speed)*dt*1.3);
 speed=Math.max(0,Math.min(220,speed));
 distance+=speed*dt*.65;
 roadOffset+=speed*dt*.08;
 playerX+=steering*dt*1.8;
 playerX=Math.max(-.88,Math.min(.88,playerX));
 spawn+=dt;
 if(spawn>1.7){
  spawn=0;
  rivals.push({z:850,lane:(Math.floor(Math.random()*3)-1)*.58,color:["#e9e9e9","#24517c","#191b20","#d2a324","#a52b2b"][Math.floor(Math.random()*5)]});
 }
 for(const r of rivals)r.z-=speed*dt*1.25;
 rivals=rivals.filter(r=>r.z>-100);
 for(const r of rivals){
  if(r.z<70&&r.z>0&&Math.abs(r.lane-playerX)<.23){
   speed=Math.max(35,speed-90*dt);
  }
 }
 if(distance>=finish){
  playing=false;
  level++;
  finish+=700;
  $("heading").textContent="LEVEL COMPLETE!";
  $("message").textContent="Excellent driving! You completed the race.";
  $("submessage").textContent="Level "+level+" is ready.";
  $("start").textContent="NEXT LEVEL";
  $("menu").style.display="grid";
 }
 $("level").textContent="LEVEL "+level;
 $("distance").textContent=Math.floor(distance)+" m";
 $("speed").textContent=Math.floor(speed)+" km/h";
}

function frame(time){
 const dt=Math.min((time-last)/1000,.04)||0;
 last=time;
 update(dt);
 drawScene();
 requestAnimationFrame(frame);
}

function startRace(){
 distance=0;speed=70;playerX=0;
 rivals=[];spawn=0;gas=false;steering=0;
 playing=true;
 $("menu").style.display="none";
}
$("start").addEventListener("click",startRace);

function holdButton(id,callback){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();callback(true);});
 ["pointerup","pointercancel","pointerleave"].forEach(event=>{
  el.addEventListener(event,()=>callback(false));
 });
}
holdButton("left",v=>steering=v?-1:0);
holdButton("right",v=>steering=v?1:0);
holdButton("gas",v=>gas=v);

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")steering=-1;
 if(e.key==="ArrowRight"||e.key==="d")steering=1;
 if(e.key==="ArrowUp"||e.key==="w")gas=true;
});
addEventListener("keyup",e=>{
 if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))steering=0;
 if(["ArrowUp","w"].includes(e.key))gas=false;
});

requestAnimationFrame(frame);
</script>
</body>
</html>
